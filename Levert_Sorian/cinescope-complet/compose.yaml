services:
  api:
    build:
      context: ./cinescope-api
    env_file:
      - ./cinescope-api/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./cinescope
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
