<main class="welcome-screen">
  <div class="welcome-layout">
    <section class="welcome-content" aria-labelledby="welcome-title">
      <p class="welcome-eyebrow">{{ i18n.t('welcomeEyebrow') }}</p>
      <h1 id="welcome-title">{{ i18n.t('welcomeTitle') }}</h1>
      <p class="welcome-description">{{ i18n.t('welcomeDescription') }}</p>
      <a class="btn-enter" routerLink="/catalogue">{{ i18n.t('discover') }}</a>
    </section>

    <div class="poster-wall" *ngIf="featuredPosters().length" aria-hidden="true">
      <div class="poster-wall-glow"></div>
      <div class="poster-stack">
        <img
          *ngFor="let media of featuredPosters(); let index = index"
          class="poster-tile"
          [ngClass]="'poster-tile-' + index"
          [src]="media.posterUrl"
          alt=""
          loading="eager"
          decoding="async"
          [attr.fetchpriority]="index < 2 ? 'high' : 'auto'"
        />
      </div>
      <span class="poster-wall-orbit orbit-one"></span>
      <span class="poster-wall-orbit orbit-two"></span>
    </div>
  </div>
</main>
