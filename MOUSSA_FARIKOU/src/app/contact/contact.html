<div class="container">
  <div>
    <h3>Contact</h3>
    <hr>
  </div>

  <mat-card class="info-card">
    <mat-card-header>
      <mat-card-title>Développeur de l'application</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p><strong>Nom :</strong> MOUSSA</p>
      <p><strong>Formation :</strong> Licence Professionnelle LPMI, Université de Bourgogne</p>
      <p><strong>Projet :</strong> Tracker de Cryptomonnaies (Angular)</p>
    </mat-card-content>
  </mat-card>

  <div class="form-size">
    <h3>Send us your Feedback</h3>
    <p>{{ feedbackForm.value | json }} {{ feedbackForm.status | json }}</p>

    <form novalidate [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">
      <p>
        <mat-form-field class="half-width">
          <input matInput formControlName="firstname" placeholder="First Name" type="text" required>
        </mat-form-field>
        <mat-form-field class="half-width">
          <input matInput formControlName="lastname" placeholder="Last Name" type="text" required>
        </mat-form-field>
      </p>
      <p>
        <mat-form-field class="half-width">
          <input matInput formControlName="telnum" placeholder="Telephone Number" type="tel" required>
        </mat-form-field>
        <mat-form-field class="half-width">
          <input matInput formControlName="email" placeholder="eMail" type="email">
        </mat-form-field>
      </p>
      <table class="form-size">
        <tr>
        <td>
          <mat-slide-toggle formControlName="agree">May we contact you ?</mat-slide-toggle>
        </td>
        <td>
          <mat-form-field>
            <mat-select placeholder="How?" formControlName="contacttype">
              <mat-option *ngFor="let ctype of contactType" [value]="ctype">
                {{ ctype }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </td>
        </tr>
      </table>
      <p>
        <mat-form-field class="full-width">
          <textarea matInput formControlName="message" placeholder="Your Feedback" rows=12></textarea>
        </mat-form-field>
      </p>
      <button type="submit" mat-flat-button>Submit</button>
    </form>
  </div>
</div>
